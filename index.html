const today=()=>new Date().toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});
const safeId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function setStatus(s){el('status').textContent=s}
function persist(){if(!cloud){localStorage.setItem(STORAGE,JSON.stringify(state));render()}else cloud.set(state).catch(e=>{alert('No se pudo guardar: '+e.message)})}
async function boot(){try{if(FIREBASE_CONFIG){if(typeof firebase==='undefined')throw Error('No cargó Firebase');firebase.initializeApp(FIREBASE_CONFIG);await firebase.auth().signInAnonymously();cloud=firebase.database().ref('pedidos_v1');cloud.on('value',snap=>{state=snap.val()||initial();connected=true;setStatus('🟢 Sincronización activa');render()},err=>{setStatus('🔴 Error de sincronización');alert(err.message)});setStatus('Conectando…')}else{state=JSON.parse(localStorage.getItem(STORAGE)||'null')||initial();setStatus('🟠 Modo local de prueba · sin sincronización');render()}}catch(e){setStatus('🔴 Sin conexión: '+e.message);alert('No se pudo conectar: '+e.message)}}
function tab(t){currentTab=t;el('review').classList.toggle('hidden',t!=='review');el('buy').classList.toggle('hidden',t!=='buy');el('tabReview').classList.toggle('primary',t==='review');el('tabBuy').classList.toggle('primary',t==='buy');render()}
function start(mode){if(state.revision&&!state.revision.closed)return alert('Ya hay una revisión abierta.');if(state.revision?.closed&&!confirm('¿Iniciar una nueva revisión? El pedido anterior se guardará en el historial.'))return;const old=state.revision;if(old?.closed)state.history=[old,...(state.history||[])].slice(0,90);state.revision={id:safeId(),mode,createdAt:Date.now(),closed:false,answers:{},special:[],bought:{}};persist()}
function resetCapture(){
 const r=state.revision;
 if(!r||r.closed)return;
 const answered=Object.keys(r.answers||{}).length;
 const specials=(r.special||[]).length;
 if(!confirm(`¿Reiniciar esta captura? Se borrarán ${answered} respuestas y ${specials} pedidos especiales. Podrás elegir nuevamente entre revisión rápida y completa. Esta acción no se puede deshacer.`))return;
 // La captura aún no está cerrada: se descarta sin afectar historial ni pedidos finalizados.
 state.revision=null;
 persist();
 currentTab='review';
 window.scrollTo({top:0,behavior:'smooth'});
}

function answer(id,value){const r=state.revision;if(!r||r.closed)return;r.answers[id]=value;persist()}
function addSpecial(){const r=state.revision;if(!r||r.closed)return;const name=el('specialName').value.trim(),qty=el('specialQty').value.trim(),note=el('specialNote').value.trim(),provider=el('specialProvider').value.trim();if(!name||!qty)return alert('Escribe el producto y la cantidad.');r.special.push({id:safeId(),name,qty,note,provider});persist()}
function removeSpecial(id){const r=state.revision;if(!r||r.closed)return;r.special=r.special.filter(s=>s.id!==id);persist()}
function finalize(){const r=state.revision;if(!r||r.closed)return;const visible=CATALOG.filter(p=>r.mode==='completo'||p.essential);const missing=visible.filter(p=>r.answers[p.id]===undefined);if(missing.length)return alert(`Faltan ${missing.length} productos por revisar.`);if(!confirm('¿Finalizar y cerrar definitivamente este pedido? No se podrá editar la revisión.'))return;r.closed=true;r.closedAt=Date.now();persist();tab('buy')}
function toggleBought(key,value){const r=state.revision;if(!r||!r.closed)return;if(cloud){cloud.child('revision/bought/'+key).set(value).catch(e=>alert('No se pudo guardar la compra: '+e.message))}else{r.bought[key]=value;persist()}}
function listItems(r){if(!r)return[];const arr=CATALOG.filter(p=>r.answers[p.id]!==undefined&&r.answers[p.id]!=='No').map(p=>({key:'p'+p.id,name:p.name,qty:r.answers[p.id],provider:p.provider||'Sin proveedor',special:false}));for(const s of r.special||[])arr.push({key:'s'+s.id,name:s.name,qty:s.qty,provider:s.provider||'PEDIDOS ESPECIALES',special:true,note:s.note});return arr}
function render(){renderReview();renderBuy()}
function renderReview(){const r=state.revision;if(!r){el('review').innerHTML=`<div class="card"><h2>Comenzar revisión</h2><p class="muted">Elige el tipo de recorrido. Los productos aparecerán en el orden de los exhibidores.</p><div class="seg"><button class="primary" onclick="start('rapido')">⚡ Modo rápido<br><small>72 indispensables</small></button><button onclick="start('completo')">📋 Completo<br><small>206 productos</small></button></div><p class="notice">Las revisiones se guardan automáticamente. El modo rápido omite productos opcionales, no los marca como «No».</p></div>`;return}
if(r.closed){el('review').innerHTML=`<div class="card"><h2>✅ Revisión finalizada</h2><p>Pedido cerrado: ${esc(new Date(r.closedAt).toLocaleString('es-MX'))}</p><p class="muted">Modo ${esc(r.mode)}. Ya no se puede modificar.</p><button class="primary" onclick="tab('buy')">Ver pedido</button> <button onclick="start('rapido')">Nueva rápida</button> <button onclick="start('completo')">Nueva completa</button></div>`;return}
const visible=CATALOG.filter(p=>r.mode==='completo'||p.essential);const done=visible.filter(p=>r.answers[p.id]!==undefined).length;let s=`<div class="card"><div class="row"><h2 class="section-title">${r.mode==='rapido'?'⚡ Revisión rápida':'📋 Revisión completa'}</h2><span class="pill">${done} / ${visible.length} revisados</span></div><div class="progress"><div style="width:${done/visible.length*100}%"></div></div><p class="muted">Recorre la tienda y marca una opción para cada producto, incluso cuando no se comprará.</p>`;
for(const p of visible){const chosen=r.answers[p.id];s+=`<div class="product"><div class="row"><span class="name">${esc(p.name)}</span><span class="${chosen!==undefined?'check':'muted'}">${chosen!==undefined?'✓ Revisado':'○ Pendiente'}</span></div><div class="choices">${p.options.map(o=>`<button class="${chosen===o?'selected':''}" onclick="answer(${p.id},${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div></div>`}s+='</div>';
s+=`<div class="card"><h2 class="section-title">📦 Pedidos especiales</h2><p class="muted">Agrega encargos o productos que no estén en el recorrido.</p><div class="special"><div><label>Producto</label><input id="specialName" placeholder="Ej. Aguacate"></div><div><label>Cantidad</label><input id="specialQty" placeholder="Ej. 2 kg"></div><div><label>Proveedor (opcional)</label><input id="specialProvider" placeholder="Ej. D"></div><div><label>Nota (opcional)</label><input id="specialNote" placeholder="Ej. Para Doña Tere"></div></div><p><button onclick="addSpecial()">+ Agregar pedido especial</button></p>${(r.special||[]).map(x=>`<div class="row product"><span>${esc(x.name)} · ${esc(x.qty)} <small class="muted">${esc(x.note)}</small></span><button onclick="removeSpecial('${x.id}')">Quitar</button></div>`).join('')}</div>`;
s+=`<div class="card"><div class="row"><strong>${done} / ${visible.length} revisados</strong><span class="pill ${done===visible.length?'green':'amber'}">${done===visible.length?'Listo para cerrar':`Faltan ${visible.length-done}`}</span></div><p class="notice">Una vez finalizada, la revisión quedará bloqueada. Si algo se olvidó, comunícalo por WhatsApp.</p><button class="primary" style="width:100%" ${done!==visible.length?'disabled':''} onclick="finalize()">Finalizar pedido</button><button class="reset-capture" onclick="resetCapture()">↺ Reiniciar captura y elegir modo</button></div>`;el('review').innerHTML=s}
function renderBuy(){const r=state.revision;if(!r){el('buy').innerHTML='<div class="card"><h2>🛒 Mis compras</h2><p>Aún no se ha iniciado una revisión.</p></div>';return}if(!r.closed){el('buy').innerHTML=`<div class="card"><h2>🛒 Mis compras</h2><p class="notice">La revisión está en proceso. El pedido aparecerá aquí cuando el operador la finalice.</p><p class="muted">Iniciada: ${esc(new Date(r.createdAt).toLocaleString('es-MX'))}</p></div>`;return}
const items=listItems(r),bought=items.filter(x=>r.bought?.[x.key]).length;const groups={};for(const x of items)(groups[x.provider]??=[]).push(x);let s=`<div class="card"><div class="row"><h2 class="section-title">🛒 Pedido para compras</h2><span class="pill green">Cerrado</span></div><p class="muted">${esc(new Date(r.closedAt).toLocaleString('es-MX'))} · Modo ${esc(r.mode)} · ${r.mode==='rapido'?'Productos opcionales omitidos':'Revisión completa'}</p><div class="row"><strong>${bought} / ${items.length} comprados</strong><span class="pill">${items.length-bought} pendientes</span></div><div class="progress"><div style="width:${items.length?bought/items.length*100:100}%"></div></div><div class="toolbar"><button onclick="filterPending=false;renderBuy()" class="${!filterPending?'selected':''}">Todos</button><button onclick="filterPending=true;renderBuy()" class="${filterPending?'selected':''}">Pendientes</button></div></div>`;
if(!items.length)s+='<div class="card">No se solicitaron productos para comprar.</div>';
for(const [provider,rows] of Object.entries(groups)){const show=rows.filter(x=>!filterPending||!r.bought?.[x.key]);if(!show.length)continue;s+=`<div class="card"><h2 class="section-title">Proveedor: ${esc(provider)}</h2>`;for(const x of show){const ck=!!r.bought?.[x.key];s+=`<label class="purchase-row"><input type="checkbox" ${ck?'checked':''} onchange="toggleBought('${x.key}',this.checked)"><span class="desc ${ck?'item-bought':''}"><strong>${esc(x.name)}</strong><br><span class="summary">Comprar: ${esc(x.qty)}${x.special?' · Pedido especial':''}${x.note?' · '+esc(x.note):''}</span></span></label>`}s+='</div>'}
s+=`<div class="card"><h2 class="section-title">Historial</h2><p class="muted">${(state.history||[]).length} revisiones anteriores conservadas. El historial no altera el pedido actual.</p>${(state.history||[]).slice(0,10).map(h=>`<details><summary>${esc(new Date(h.closedAt).toLocaleString('es-MX'))} · ${esc(h.mode)}</summary><p class="muted">${listItems(h).map(x=>esc(x.name)+' ('+esc(x.qty)+')').join(' · ')||'Sin compras'}</p></details>`).join('')}</div>`;el('buy').innerHTML=s}
boot();
</script></body></html>
